name: 🏷️ Unrecognised parcel status
description: The integration logged a warning asking you to report an unrecognised status or event.
title: "[status] "
labels: ["unrecognised-status"]
assignees:
  - peternijssen
body:
  - type: markdown
    attributes:
      value: |
        **This integration was built without ever seeing a real Dynalogic
        response**, so below 1.0 it logs a warning for every assumption it
        makes. Each one ends with a link to this form. Anything you paste here
        is genuinely useful — these reports are what gets it to 1.0.

        The most valuable one is the structure listing:

        ```
        Dynalogic response structure (field names and types only, no values
        — safe to paste). …
            ActiveStep: int
            OrderData.Activities[].ExecutedDateTime: str
            …
        ```

        It contains **field names and types only** — no addresses, names or
        order numbers — so it is safe to paste in full. The other warnings
        (an unrecognised scenario or result code, a timestamp we could not
        parse, a status combination we may have read wrong) are just as welcome.
  - type: textarea
    id: logline
    attributes:
      label: The log line(s)
      description: Copy the full warning from your Home Assistant log — the whole block, including the indented lines under it.
      render: text
    validations:
      required: true
  - type: textarea
    id: reality
    attributes:
      label: What did Dynalogic itself say at that moment?
      description: >-
        Only if the warning was about a status. What the carrier's own app or
        tracking page showed for this parcel — "out for delivery", "delivered
        to the neighbour", the delivery window it displayed. That sentence is
        what turns a status code into a meaning; we cannot look it up anywhere.
      placeholder: "e.g. the app showed 'onderweg, tussen 14:00 en 16:00'"
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 2.6.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.7.0"
  - type: markdown
    attributes:
      value: |
        ### 💡 Even better: attach a diagnostics file

        A diagnostics download shows us the exact payload behind the warning —
        usually all we need to fix the mapping, with no back-and-forth.

        1. In Home Assistant, open **Settings → Devices & services**.
        2. Open this integration, then click the **⋮** (three dots) on its entry.
        3. Choose **Download diagnostics**.
        4. Drag the downloaded file onto this issue to attach it.

        Home Assistant redacts the file before download — names, addresses and
        tracking numbers are removed, while the status codes we need are kept.
