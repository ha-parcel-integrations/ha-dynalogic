# Add a Dynalogic parcel straight from a dashboard — no diving into the options.
#
# The integration exposes two services:
#   - dynalogic.track_parcel   (tracking_code, optional postal_code)
#   - dynalogic.untrack_parcel (tracking_code)
#
# The postcode is left out here on purpose: track_parcel falls back to the one
# you entered when setting the integration up, which is right for almost every
# parcel. Add a second input_text and pass `postal_code:` below if you often
# track deliveries to another address.
#
# This example wires a text field + a button on a Lovelace card to
# dynalogic.track_parcel. It needs one helper and one script (below), then the card.

# ---------------------------------------------------------------------------
# 1) Helper — Settings → Devices & Services → Helpers → Create → Text,
#    or in configuration.yaml:
# ---------------------------------------------------------------------------
input_text:
  dynalogic_new_parcel:
    name: New Dynalogic order number
    max: 30

# ---------------------------------------------------------------------------
# 2) Script — reads the text field, tracks the parcel, then clears the field.
#    Add to scripts.yaml (or Settings → Automations & Scenes → Scripts).
# ---------------------------------------------------------------------------
dynalogic_track_new_parcel:
  alias: "Dynalogic: track the parcel in the input box"
  sequence:
    - condition: template
      value_template: "{{ states('input_text.dynalogic_new_parcel') | trim != '' }}"
    - action: dynalogic.track_parcel
      data:
        tracking_code: "{{ states('input_text.dynalogic_new_parcel') | trim }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.dynalogic_new_parcel
      data:
        value: ""

# ---------------------------------------------------------------------------
# 3) Lovelace card — paste into a dashboard (Edit → raw config, or add a
#    manual card). Type the number, press the button.
# ---------------------------------------------------------------------------
# type: entities
# title: Track a Dynalogic parcel
